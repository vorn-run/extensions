id = "vorn.browser"
name = "Browser"
version = "1.0.0"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "Web pages in tabs beside a session's terminal, opened from its card or by its agent, which reads them, finds in them and acts on them with its browser tools."

[icon]
view_box = "0 0 24 24"
paths = ["M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20zM12 4a8 8 0 1 1 0 16a8 8 0 1 1 0-16z", "M11 3h2v18h-2z", "M3 11h18v2H3z"]

[declares]
uses = ["web", "sessions.read", "storage"]

[service]
component = "browser.wasm"
start = "start"

[[contributes.panes]]
id = "browser"
title = "Browser"
tree = true

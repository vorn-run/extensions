id = "postgres"
name = "PostgreSQL"
version = "0.1.2"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "Trigger workflows from new rows in a PostgreSQL database, and query or write to it from a step."

[icon]
view_box = "0 0 24 24"
paths = ["M12 3c-4.97 0-9 1.34-9 3s4.03 3 9 3 9-1.34 9-3-4.03-3-9-3z", "M3 8v3c0 1.66 4.03 3 9 3s9-1.34 9-3V8c0 1.66-4.03 3-9 3S3 9.66 3 8z", "M3 13v3c0 1.66 4.03 3 9 3s9-1.34 9-3v-3c0 1.66-4.03 3-9 3s-9-1.34-9-3z"]

[service]
command = ["node", "index.js"]

[checks]
command = ["node", "index.js", "--check"]

[connector]

[connector.auth]
rung = "key"
keys = ["connectionString"]

[[connector.triggers]]
type = "newRows"
label = "New rows in a table"
description = "Fires once per row inserted after the last seen value of the ordering column."
default_workflow = { name = "PostgreSQL: new rows", default_cron_from_minutes = 5 }

[[connector.triggers]]
type = "queryRows"
label = "Rows matching a query"
description = "Fires once per row your SELECT returns beyond the cursor value it was last run with."
default_workflow = { name = "PostgreSQL: query rows", default_cron_from_minutes = 5 }

[[connector.actions]]
type = "runQuery"
label = "Run a query"
description = "Run SQL text with positional parameters and return its rows and row count."
outputs = [{ key = "rows", description = "The rows of the last result set" }, { key = "rowCount", type = "number", description = "Rows the last statement touched or returned" }, { key = "command", type = "string", description = "The command tag, e.g. SELECT or UPDATE" }]

[[connector.actions.inputs]]
key = "sql"
label = "SQL"
required = true
description = "SQL text; several statements are allowed when there are no params."

[[connector.actions.inputs]]
key = "params"
label = "Parameters"
type = "json"
description = "Positional values for $1…, as a JSON array."

[[connector.actions]]
type = "selectRows"
label = "Select rows"
description = "Read rows from a table, with an optional parameterised WHERE."
outputs = [{ key = "rows", description = "The rows" }, { key = "rowCount", type = "number", description = "How many came back" }]

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "table or schema.table"

[[connector.actions.inputs]]
key = "where"
label = "Where"
description = "SQL placed after WHERE, with $1… placeholders, e.g. status = $1"

[[connector.actions.inputs]]
key = "params"
label = "Parameters"
type = "json"
description = "Values for the placeholders, a JSON array."

[[connector.actions.inputs]]
key = "orderBy"
label = "Order by"
description = "Column name to order by, ascending."

[[connector.actions.inputs]]
key = "limit"
label = "Limit"
type = "number"
description = "Default 100, at most 1000."

[[connector.actions]]
type = "insertRow"
label = "Insert a row"
description = "Insert one row and return it as stored."
outputs = [{ key = "row", description = "The inserted row, from RETURNING *" }, { key = "rowCount", type = "number", description = "1 when a row was inserted" }]

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "table or schema.table"

[[connector.actions.inputs]]
key = "values"
label = "Values"
type = "json"
required = true
description = "JSON object of column: value."

[[connector.actions]]
type = "updateRows"
label = "Update rows"
description = "Set columns on the rows a WHERE matches and return how many changed."
outputs = [{ key = "rowCount", type = "number", description = "Rows updated" }]

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "table or schema.table"

[[connector.actions.inputs]]
key = "set"
label = "Set"
type = "json"
required = true
description = "JSON object of column: new value."

[[connector.actions.inputs]]
key = "where"
label = "Where"
required = true
description = "SQL placed after WHERE, with $1… placeholders. Required, so a step cannot update every row by omission."

[[connector.actions.inputs]]
key = "params"
label = "Parameters"
type = "json"
description = "Values for the where placeholders, a JSON array."

[[connector.actions]]
type = "listTables"
label = "List tables"
description = "List the tables and views in a schema that the role can see."
outputs = [{ key = "tables", description = "Array of { schema, name, type }" }, { key = "count", type = "number", description = "How many" }]

[[connector.actions.inputs]]
key = "schema"
label = "Schema"
description = "Defaults to public."

[[connector.actions]]
type = "describeTable"
label = "Describe a table"
description = "List the columns of a table with their types and nullability."
outputs = [{ key = "columns", description = "Array of { name, type, udtName, nullable, default, position }" }, { key = "count", type = "number", description = "How many" }]

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "table (schema public) or schema.table"

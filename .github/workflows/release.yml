name: Release

# Tagged per extension — `ado-v0.2.0` publishes only that package, and
# `adapters-claude-v1.0.0` only that adapter. An extension releasing on its own
# schedule is the whole reason these live outside the app.
on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  # A connector is an npm package; an extension written in Rust is a folder
  # with a vorn-extension.toml and no package.json, released as its pack.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
      - id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%-v*}"
          if [ -f "$name/package.json" ]; then
            echo "kind=npm" >> "$GITHUB_OUTPUT"
          else
            echo "kind=rust" >> "$GITHUB_OUTPUT"
          fi

  # The pack Vorn installs and pins by checksum: built and tested at the tagged
  # commit by the same packer CI runs, so its bytes are the ones catalog.json
  # lists. A pack that does not match the catalog is not released.
  pack:
    needs: resolve
    if: needs.resolve.outputs.kind == 'rust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --locked --release --workspace
      - name: Pack the extension the tag names
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run --locked --release -p vorn-pack -- --tag "$TAG" --out release-assets
      - name: Check the pack is the one the catalog lists
        run: |
          for listing in release-assets/*.vorn.json; do
            id=$(node -p "require('./$listing').id")
            sha=$(node -p "require('./$listing').sha256")
            listed=$(node -p "(require('./catalog.json').connectors.find((c) => c.id === '$id') || {}).sha256")
            if [ "$sha" != "$listed" ]; then
              echo "::error::$id packs to $sha but catalog.json lists $listed"
              exit 1
            fi
          done
      # As for a connector: the notes come from the folder's CHANGELOG.md, and
      # every value reaches the shell through env:, never as interpolated text.
      - name: Take the notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%-v*}"
          version="${TAG##*-v}"
          dir="$name"
          [ -d "$dir" ] || dir="${name/-//}"
          changelog="$dir/CHANGELOG.md"
          if [ ! -f "$changelog" ]; then
            echo "::error::$changelog does not exist — a release needs notes"
            exit 1
          fi
          awk -v v="## $version" '
            $0 == v      { grab = 1; next }
            grab && /^## / { exit }
            grab         { print }
          ' "$changelog" > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::$changelog has no '## $version' section"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo
            echo '---'
            echo "sha256:"
            cat release-assets/*.vorn.tgz.sha256
          } >> release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            release-assets/*.vorn.tgz release-assets/*.vorn.tgz.sha256

  publish:
    needs: resolve
    if: needs.resolve.outputs.kind == 'npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: yarn install --immutable

      - name: Resolve the package from the tag
        id: pkg
        run: |
          name="${GITHUB_REF_NAME%%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          echo "dir=$name" >> "$GITHUB_OUTPUT"
          echo "workspace=$(node -p "require('./$name/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $name@$version"

      - name: Check the tag matches the package
        run: |
          declared=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          if [ "$declared" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag says ${{ steps.pkg.outputs.version }} but package.json says $declared"
            exit 1
          fi

      # The gate CI runs on every pull request, run again here against the
      # exact commit being published. A tag can point at any commit, including
      # one that never sat on main, and npm publishes are not retractable after
      # 72 hours.
      #
      # `yarn build` comes before the catalog check on purpose: that check
      # imports each package's built dist/ to read its manifest, so on a fresh
      # checkout it fails with "ado is not built" rather than telling
      # you anything about the catalog. Every workspace is built, not just the
      # one being released, because the check reads all of them.
      - run: yarn typecheck
      - run: yarn workspace ${{ steps.pkg.outputs.workspace }} run test
      - run: yarn build
      - run: node scripts/build-catalog.mjs --check

      # The release notes come from the package's own CHANGELOG.md, read
      # between this version's heading and the next one. Autogenerated commit
      # lists describe what a developer did; this describes what changed for
      # the person installing it.
      #
      # The notes are written to a file rather than a step output, and every
      # value below arrives through env: rather than ${{ }} interpolation.
      # GitHub pastes an interpolated expression into the script as literal
      # text before bash sees it, so a changelog line mentioning a command in
      # backticks becomes a command substitution that actually runs — that is
      # how `gh auth login` in the GitHub connector's notes executed `gh` and
      # published its help output as the release body. A changelog is ordinary
      # prose from the repository; it must never reach a shell as code.
      - name: Take the notes from the changelog
        env:
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          changelog="$PKG_DIR/CHANGELOG.md"
          if [ ! -f "$changelog" ]; then
            echo "::error::$changelog does not exist — a release needs notes"
            exit 1
          fi
          awk -v v="## $VERSION" '
            $0 == v      { grab = 1; next }
            grab && /^## / { exit }
            grab         { print }
          ' "$changelog" > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::$changelog has no '## $VERSION' section"
            exit 1
          fi

      # The same bytes the app installs when it prefers a pack over npm, built
      # from the dist/ the catalog check just read. Named `<id>-<version>.vorn.tgz`
      # by the packer, which is the address the catalog's packUrl points at.
      - name: Pack the connector for the release
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: node ../../node_modules/@vornrun/connector-sdk/dist/cli.js pack ./dist/index.js --out ../../release-assets

      # `yarn build` above already built this package along with the rest, so
      # what ships is the artifact the catalog check just read rather than a
      # second, later build of the same source.
      - run: yarn npm publish --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After the publish, deliberately. A release pointing at a version npm
      # does not have is worse than a publish with no release: the first sends
      # people to an install that fails, the second is merely undocumented.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKSPACE: ${{ steps.pkg.outputs.workspace }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          {
            echo
            echo '---'
            echo "Install: \`npx -y $WORKSPACE\`"
            echo "npm: https://www.npmjs.com/package/$WORKSPACE/v/$VERSION"
          } >> release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$WORKSPACE $VERSION" \
            --notes-file release-notes.md \
            release-assets/*.vorn.tgz

id = "substack"
name = "Substack"
version = "0.2.4"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "Trigger workflows from new posts on a Substack publication, and read, search, like, restack and comment on posts, post and read Notes, or save and update a draft with pictures from a step."

[icon]
view_box = "0 0 24 24"
paths = ["M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"]

[service]
command = ["node", "index.js"]

[checks]
command = ["node", "index.js", "--check"]

[declares]
network = ["substack.com", "*.substack.com"]

[connector]

[connector.auth]
rung = "browser"
browser = { sign_in_url = "https://substack.com/sign-in", origins = ["https://substack.com", "https://*.substack.com"], check = { url = "https://substack.com/api/v1/user/profile/self", identity = ["name", "handle"] } }

[[connector.triggers]]
type = "newPost"
label = "New post"
description = "A post appears in the publication's RSS feed. Reading the feed needs no sign-in; it holds about the last twenty posts, so a burst larger than that between polls loses the oldest."

[[connector.actions]]
type = "readFeed"
label = "Read feed"
description = "The newest posts of any publication from its RSS feed, up to 20, with each body as text and HTML. Needs no sign-in."
outputs = [{ key = "publication", type = "string", description = "The host the feed was read from" }, { key = "count", type = "number", description = "How many posts came back, in `posts`" }]

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "Its substack.com subdomain or address; the connection's publication when empty."

[[connector.actions.inputs]]
key = "limit"
label = "Posts"
type = "number"
description = "How many of the newest posts, from 1 to 20; 10 when empty."

[[connector.actions]]
type = "searchPosts"
label = "Search posts"
description = "Posts across Substack matching a query, a page at a time, as Substack search ranks them. Needs no sign-in."
outputs = [{ key = "count", type = "number", description = "How many posts are on this page, in `posts`" }, { key = "more", type = "boolean", description = "Whether a next page exists" }]

[[connector.actions.inputs]]
key = "query"
label = "Query"
required = true
description = "Words to search posts for."

[[connector.actions.inputs]]
key = "page"
label = "Page"
type = "number"
description = "Which page of results, from 0; 0 when empty."

[[connector.actions]]
type = "readComments"
label = "Read comments"
description = "Every comment on a post, newest first, with replies after the comment they answer. Needs no sign-in for a public post."
outputs = [{ key = "postId", type = "number", description = "The post's id" }, { key = "count", type = "number", description = "How many comments came back, in `comments`" }]

[[connector.actions.inputs]]
key = "post"
label = "Post"
description = "The post's address, or its slug on the publication; not needed when its id is given."

[[connector.actions.inputs]]
key = "postId"
label = "Post id"
type = "number"
description = "The post's id, as Search posts returns it; saves looking the post up by address."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "Its substack.com subdomain or address; the connection's publication when empty."

[[connector.actions]]
type = "listPosts"
label = "List posts"
description = "A publication's archive, newest first, up to 500 posts, where the feed holds only the last twenty. Needs no sign-in."
outputs = [{ key = "publication", type = "string", description = "The host the archive was read from" }, { key = "count", type = "number", description = "How many posts came back, in `posts`" }]

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "Its substack.com subdomain or address; the connection's publication when empty."

[[connector.actions.inputs]]
key = "limit"
label = "Posts"
type = "number"
description = "How many of the newest posts, from 1 to 500; 50 when empty."

[[connector.actions]]
type = "getPost"
label = "Get post"
description = "One post with its whole body as HTML and as text, and its likes and restacks. Needs no sign-in for a public post."
outputs = [{ key = "id", type = "number", description = "The post's id" }, { key = "title", type = "string", description = "The post's title" }, { key = "url", type = "string", description = "The post's address" }, { key = "text", type = "string", description = "The body as plain text" }]

[[connector.actions.inputs]]
key = "post"
label = "Post"
required = true
description = "The post's address, or its slug on the publication."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "Its substack.com subdomain or address; the connection's publication when empty."

[[connector.actions]]
type = "createDraft"
label = "Save draft"
description = "Save a new draft on your publication from a title and markdown, for you to review and publish in Substack. It never publishes, since publishing emails every subscriber."
outputs = [{ key = "id", type = "number", description = "The draft's id" }, { key = "editUrl", type = "string", description = "Where to open the draft in the Substack editor" }]

[[connector.actions.inputs]]
key = "title"
label = "Title"
required = true
description = "The draft's title."

[[connector.actions.inputs]]
key = "subtitle"
label = "Subtitle"
description = "The line under the title."

[[connector.actions.inputs]]
key = "body"
label = "Body"
required = true
description = "The post in markdown: headings, lists, quotes, code, links and emphasis carry over."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
type = "select"
description = "Its substack.com subdomain; the connection's publication when empty, else the account's primary one."
load_options = "publications"

[[connector.actions]]
type = "updateDraft"
label = "Update draft"
description = "Replace a draft's title, subtitle and body with new markdown. A published post is refused, and it never publishes."
outputs = [{ key = "updated", type = "boolean", description = "Whether the draft was saved" }, { key = "id", type = "number", description = "The draft's id" }, { key = "editUrl", type = "string", description = "Where to open the draft in the Substack editor" }]

[[connector.actions.inputs]]
key = "draftId"
label = "Draft id"
type = "number"
required = true
description = "The id Save draft returned."

[[connector.actions.inputs]]
key = "title"
label = "Title"
required = true
description = "The draft's title."

[[connector.actions.inputs]]
key = "subtitle"
label = "Subtitle"
description = "The line under the title; empty leaves the draft without one."

[[connector.actions.inputs]]
key = "body"
label = "Body"
required = true
description = "The whole post in markdown, replacing what the draft held."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
type = "select"
description = "Its substack.com subdomain; the connection's publication when empty, else the account's primary one."
load_options = "publications"

[[connector.actions]]
type = "saveDraft"
label = "Save or update draft"
description = "Update the draft a step names, or save a new one when it names none or that draft has since been deleted or published, from a title and markdown with an optional cover picture. Run again with the id it returned, it updates the same draft. It never publishes."
outputs = [{ key = "id", type = "number", description = "The draft's id, to hand the next run" }, { key = "title", type = "string", description = "The draft's title" }, { key = "editUrl", type = "string", description = "Where to open the draft in the Substack editor" }, { key = "created", type = "boolean", description = "Whether a new draft was saved rather than one updated" }]

[[connector.actions.inputs]]
key = "draftId"
label = "Draft id"
type = "number"
description = "The id this action returned before; empty or 0 saves a new draft."

[[connector.actions.inputs]]
key = "title"
label = "Title"
required = true
description = "The draft's title."

[[connector.actions.inputs]]
key = "subtitle"
label = "Subtitle"
description = "The line under the title; empty leaves the draft without one."

[[connector.actions.inputs]]
key = "body"
label = "Body"
required = true
description = "The whole post in markdown. A line holding only a picture Upload image returned, as ![alt](address), becomes a picture in the post."

[[connector.actions.inputs]]
key = "coverImage"
label = "Cover picture"
description = "A picture's address, as Upload image returns it: the post's cover, shown in previews and on social sites. Empty leaves the cover as it is."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
type = "select"
description = "Its substack.com subdomain; the connection's publication when empty, else the account's primary one."
load_options = "publications"

[[connector.actions]]
type = "deleteDraft"
label = "Delete draft"
description = "Delete a draft on your publication. A published post is refused, so this never removes one."
outputs = [{ key = "deleted", type = "boolean", description = "Whether the draft was deleted" }]

[[connector.actions.inputs]]
key = "draftId"
label = "Draft id"
type = "number"
required = true
description = "The id Save draft returned."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "Its substack.com subdomain; the connection's publication when empty, else the account's primary one."

[[connector.actions]]
type = "uploadImage"
label = "Upload image"
description = "Upload a JPEG or PNG from this computer to Substack's picture storage, for a draft's body or cover. It appears nowhere until a draft uses it."
outputs = [{ key = "url", type = "string", description = "The picture's address, for Save or update draft" }, { key = "width", type = "number", description = "Its width in pixels" }, { key = "height", type = "number", description = "Its height in pixels" }, { key = "bytes", type = "number", description = "Its size as stored" }, { key = "contentType", type = "string", description = "Its type, image/jpeg or image/png" }]

[[connector.actions.inputs]]
key = "file"
label = "Picture file"
required = true
description = "A JPEG or PNG, as an absolute path or one starting with ~/, of at most about 730 KB."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
type = "select"
description = "Its substack.com subdomain; the connection's publication when empty, else the account's primary one."
load_options = "publications"

[[connector.actions]]
type = "commentOnPost"
label = "Comment on post"
description = "Post a comment on a post as the signed-in account."
outputs = [{ key = "id", type = "number", description = "The new comment's id" }, { key = "postId", type = "number", description = "The post's id" }]

[[connector.actions.inputs]]
key = "post"
label = "Post"
description = "The post's address, or its slug on the publication; not needed when its id is given."

[[connector.actions.inputs]]
key = "postId"
label = "Post id"
type = "number"
description = "The post's id, as Search posts returns it; saves looking the post up by address."

[[connector.actions.inputs]]
key = "body"
label = "Comment"
required = true
description = "The comment, as plain text."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "The publication a post given by slug is on, as its substack.com subdomain or address; the connection's publication when empty."

[[connector.actions]]
type = "setCommentLike"
label = "Like or unlike comment"
description = "Like a comment as the signed-in account, or take the like back. Setting the same state twice changes nothing."
outputs = [{ key = "liked", type = "boolean", description = "The state now set" }]

[[connector.actions.inputs]]
key = "commentId"
label = "Comment id"
type = "number"
required = true
description = "The id Read comments returned."

[[connector.actions.inputs]]
key = "liked"
label = "Liked"
type = "boolean"
required = true
description = "true to like it, false to take the like back."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "The publication the comment's post is on; the connection's when empty, else the account's primary one."

[[connector.actions]]
type = "deleteComment"
label = "Delete comment"
description = "Delete one of the signed-in account's comments, or one on its own publication."
outputs = [{ key = "deleted", type = "boolean", description = "Whether the comment was deleted" }]

[[connector.actions.inputs]]
key = "commentId"
label = "Comment id"
type = "number"
required = true
description = "The id Read comments or Comment on post returned."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "The publication the comment's post is on; the connection's when empty, else the account's primary one."

[[connector.actions]]
type = "setPostLike"
label = "Like or unlike post"
description = "Like a post as the signed-in account, or take the like back."
outputs = [{ key = "liked", type = "boolean", description = "The state now set" }]

[[connector.actions.inputs]]
key = "post"
label = "Post"
description = "The post's address, or its slug on the publication; not needed when its id is given."

[[connector.actions.inputs]]
key = "postId"
label = "Post id"
type = "number"
description = "The post's id, as Search posts returns it; saves looking the post up by address."

[[connector.actions.inputs]]
key = "liked"
label = "Liked"
type = "boolean"
required = true
description = "true to like it, false to take the like back."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "The publication a post given by slug is on, as its substack.com subdomain or address; the connection's publication when empty."

[[connector.actions]]
type = "setPostRestack"
label = "Restack or undo restack post"
description = "Restack a post to the signed-in account's followers, or take the restack back. Posts only, not Notes."
outputs = [{ key = "restacked", type = "boolean", description = "The state now set" }]

[[connector.actions.inputs]]
key = "post"
label = "Post"
description = "The post's address, or its slug on the publication; not needed when its id is given."

[[connector.actions.inputs]]
key = "postId"
label = "Post id"
type = "number"
description = "The post's id, as Search posts returns it; saves looking the post up by address."

[[connector.actions.inputs]]
key = "restacked"
label = "Restacked"
type = "boolean"
required = true
description = "true to restack it, false to take the restack back."

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
description = "The publication a post given by slug is on, as its substack.com subdomain or address; the connection's publication when empty."

[[connector.actions]]
type = "postNote"
label = "Post a note"
description = "Post a Note as the signed-in account. Followers see it in their feeds as soon as it posts; Delete note takes it down."
outputs = [{ key = "id", type = "number", description = "The Note's id" }, { key = "url", type = "string", description = "The Note's address" }]

[[connector.actions.inputs]]
key = "body"
label = "Note"
required = true
description = "The Note in markdown, converted the way a draft's body is."

[[connector.actions.inputs]]
key = "link"
label = "Link card"
description = "An https address to show as a preview card under the Note, the card Substack's composer makes from a pasted link; it is not added to the text."

[[connector.actions]]
type = "readNotes"
label = "Read notes"
description = "A profile's Notes, newest first, up to 100, from its activity feed as the signed-in account sees it."
outputs = [{ key = "profile", type = "string", description = "The handle the Notes are from" }, { key = "count", type = "number", description = "How many Notes came back, in `notes`" }]

[[connector.actions.inputs]]
key = "profile"
label = "Profile"
description = "A Substack handle, with or without @; the signed-in account when empty."

[[connector.actions.inputs]]
key = "limit"
label = "Notes"
type = "number"
description = "How many of the newest Notes, from 1 to 100; 20 when empty."

[[connector.actions]]
type = "deleteNote"
label = "Delete note"
description = "Delete one of the signed-in account's Notes."
outputs = [{ key = "deleted", type = "boolean", description = "Whether the Note was deleted" }]

[[connector.actions.inputs]]
key = "noteId"
label = "Note id"
type = "number"
required = true
description = "The id Post a note or Read notes returned."

[[connector.actions]]
type = "readSubscriberCount"
label = "Read subscriber count"
description = "Your publication's subscriber, email and view figures, as its dashboard shows them. Needs the signed-in account to run the publication."
outputs = [{ key = "subscribers", type = "number", description = "Every subscriber, free and paid: the count the dashboard's subscribers page shows" }, { key = "paidSubscribers", type = "number", description = "Paid subscribers only" }, { key = "appSubscribers", type = "number", description = "The dashboard summary’s app subscriber figure" }, { key = "views", type = "number", description = "The dashboard summary’s view count" }, { key = "openRate", type = "number", description = "Email open rate, as the dashboard summary reports it" }]

[[connector.actions.inputs]]
key = "publication"
label = "Publication"
type = "select"
description = "Its substack.com subdomain; the connection's publication when empty, else the account's primary one."
load_options = "publications"

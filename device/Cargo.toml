[package]
name = "vorn-ext-device"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Device: an iOS simulator beside a session's terminal, claimed from its card or by its agent, which drives its apps"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vorn-extension-sdk.workspace = true
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

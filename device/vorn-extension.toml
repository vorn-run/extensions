id = "vorn.device"
name = "Device"
version = "1.0.0"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "An iOS simulator beside a session's terminal, chosen from its card or claimed by its agent, which launches, installs and opens its apps and reads its screen with its device tools."

[icon]
view_box = "0 0 24 24"
paths = ["M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM7 5v13h10V5z"]

[declares]
uses = ["video", "sessions.read", "storage"]

[service]
component = "device.wasm"
start = "start"
stop = "stop"
events = ["session.exited"]

[[contributes.panes]]
id = "device"
title = "Device"
tree = true

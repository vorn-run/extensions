# Codex CLI, run from its adapter.
id = "vorn.agents.codex"
name = "Codex CLI"
version = "1.0.0"
api = "vorn:extension@1.0"
description = "Runs Codex CLI: launches and resumes it, lists its models and reads its status."
publisher = "Vorn"

[icon]
view_box = "0 0 24 24"
paths = ["M9.064 3.344a4.578 4.578 0 012.285-.312c1 .115 1.891.54 2.673 1.275.01.01.024.017.037.021a.09.09 0 00.043 0 4.55 4.55 0 013.046.275l.047.022.116.057a4.581 4.581 0 012.188 2.399c.209.51.313 1.041.315 1.595a4.24 4.24 0 01-.134 1.223.123.123 0 00.03.115c.594.607.988 1.33 1.183 2.17.289 1.425-.007 2.71-.887 3.854l-.136.166a4.548 4.548 0 01-2.201 1.388.123.123 0 00-.081.076c-.191.551-.383 1.023-.74 1.494-.9 1.187-2.222 1.846-3.711 1.838-1.187-.006-2.239-.44-3.157-1.302a.107.107 0 00-.105-.024c-.388.125-.78.143-1.204.138a4.441 4.441 0 01-1.945-.466 4.544 4.544 0 01-1.61-1.335c-.152-.202-.303-.392-.414-.617a5.81 5.81 0 01-.37-.961 4.582 4.582 0 01-.014-2.298.124.124 0 00.006-.056.085.085 0 00-.027-.048 4.467 4.467 0 01-1.034-1.651 3.896 3.896 0 01-.251-1.192 5.189 5.189 0 01.141-1.6c.337-1.112.982-1.985 1.933-2.618.212-.141.413-.251.601-.33.215-.089.43-.164.646-.227a.098.098 0 00.065-.066 4.51 4.51 0 01.829-1.615 4.535 4.535 0 011.837-1.388zm3.482 10.565a.637.637 0 000 1.272h3.636a.637.637 0 100-1.272h-3.636zM8.462 9.23a.637.637 0 00-1.106.631l1.272 2.224-1.266 2.136a.636.636 0 101.095.649l1.454-2.455a.636.636 0 00.005-.64L8.462 9.23z"]

[agent]
id = "codex"
name = "Codex CLI"
label = "Codex"
short_name = "Codex"
description = "OpenAI Codex CLI"
icon = "icon.svg"
mark = "◎"
color = "#7a9dff"
tint = "#7a9dff20"
url = "https://github.com/openai/codex"
install = "npm install -g @openai/codex"

[agent.launch]
command = "codex"
headless_args = ["-a", "never"]

[agent.resume]
args = ["resume", "{id}"]
at = "start"
selectors = { subcommand = "resume" }

[agent.resume.capture]
db = "~/.codex/state_5.sqlite"
query = "SELECT id FROM threads WHERE archived = 0 AND rtrim(lower(replace(cwd, '\\', '/')), '/') = ?1 ORDER BY updated_at DESC LIMIT 1"

[agent.headless]
prompt = ["exec"]
no_prompt = ["exec", ""]
resume_tail = ["exec", "resume", "{id}", "-"]

[agent.models]
selectors = ["-m"]
config = { flags = ["-c", "--config"], key = "model" }

[agent.models.list]
args = ["app-server", "--stdio"]
keep = { paired = ["-c", "--config", "-p", "--profile", "--local-provider"], flags = ["--oss"] }

[[agent.models.list.steps]]
send = [{ id = 1, method = "initialize", params = { clientInfo = { name = "vorn_model_catalog", version = "1.0.0" } } }]
reply = { id = "{id}" }
fail = "error"

[[agent.models.list.steps]]
send = [{ method = "initialized" }, { id = 2, method = "model/list", params = { limit = 100, includeHidden = false } }]
reply = { id = "{id}" }
fail = "error"
models = "result.data"
next = "result.nextCursor"
cursor = "params.cursor"

[agent.models.list.choice]
id = ["model", "id"]
skip = [
  { path = "hidden", is = true },
  { path = "policy.state", is = "disabled" },
]

[agent.history]
rank = 2
activity = "entry"
title_limit = 80

[agent.history.sqlite]
db = "~/.codex/state_5.sqlite"
query = "SELECT id, cwd, title, updated_at, first_user_message FROM threads WHERE archived = 0 AND {scope} ORDER BY updated_at DESC"
scope = "cwd"
id = "id"
project = "cwd"
title = ["title", "first_user_message"]
time = "updated_at"
unit = "seconds"
count_lines = { file = "~/.codex/history.jsonl", key = "session_id", missing = 1 }

[agent.mcp]
commands = ["codex plugin marketplace add vorn-run/plugin", "codex plugin add vorn@vorn"]
note = "Restart, or start a fresh session — skills load at session start."

# An approval: a command to run, edits to apply, a network request.
[[agent.status]]
status = "waiting"
rows = [-24, -1]
any = [
  'Would you like to (run|make|apply|allow)',
  '^[\s│]*[›▌]\s*\d+\.\s+Yes',
  'Allow command\?',
]

# A turn in progress: the status line counts up and offers to interrupt.
[[agent.status]]
status = "working"
rows = [-10, -1]
any = ['(?i)\besc to interrupt\b']

# The composer, with its context and shortcuts line under it.
[[agent.status]]
status = "idle"
rows = [-8, -1]
any = ['\d+% context left', '\? for shortcuts', '^[\s│]*›(\s|$)']

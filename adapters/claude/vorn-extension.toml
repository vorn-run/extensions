# Claude Code, run from its adapter: launch, resume, models, status and hooks as data.
id = "vorn.agents.claude"
name = "Claude Code"
version = "1.0.0"
api = "vorn:extension@1.0"
description = "Runs Claude Code: launches and resumes it, lists its models, reads its status and answers its hooks."
publisher = "Vorn"


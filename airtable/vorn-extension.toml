id = "airtable"
name = "Airtable"
version = "0.1.1"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "Trigger workflows from new or updated Airtable records, and create, update, upsert, delete or read records and base schemas from a step."

[icon]
view_box = "0 0 24 24"
paths = ["M12 1.5 23 6l-11 4.5L1 6z", "M1 8l10 4.5v11L1 19z", "M13 12.5l8.6-3.9L23 9.3v9.2L13 23z"]

[service]
command = ["node", "index.js"]

[checks]
command = ["node", "index.js", "--check"]

[declares]
network = ["api.airtable.com"]

[connector]

[connector.auth]
rung = "key"
keys = ["apiKey"]

[[connector.triggers]]
type = "newRecord"
label = "A record is created"
description = "Fires once for each record created in the table since the last poll, oldest first."
default_workflow = { name = "Airtable: new records", default_cron_from_minutes = 5 }

[[connector.triggers]]
type = "updatedRecord"
label = "A record is updated"
description = "Fires for each record modified since the last poll. Name a last-modified-time field to stamp items with the real time; without one the poll time stands in."
default_workflow = { name = "Airtable: updated records", default_cron_from_minutes = 5 }

[[connector.actions]]
type = "createRecord"
label = "Create a record"
description = "Add one record to a table."
outputs = [{ key = "id", description = "Record id, rec…" }, { key = "createdTime", description = "When the record was created, ISO 8601" }, { key = "fields", description = "The cell values keyed by field name; empty cells are omitted" }, { key = "url", description = "Where to open it, when the table was given by id" }]

[[connector.actions.inputs]]
key = "baseId"
label = "Base"
required = true
description = "The base id, app…, from the base URL or listBases."

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "Table id (tbl…) or table name."

[[connector.actions.inputs]]
key = "fields"
label = "Fields"
type = "json"
required = true
description = "An object of cell values keyed by field name or id to set, e.g. {\"Name\":\"Union Square\",\"Visited\":true}."

[[connector.actions.inputs]]
key = "typecast"
label = "Typecast"
type = "boolean"
description = "Let Airtable convert strings to the field’s type, such as \"3\" into a number or a new option name into a select choice."

[[connector.actions.inputs]]
key = "returnFieldsByFieldId"
label = "Return fields by id"
type = "boolean"
description = "Key the returned fields by field id (fld…) instead of by name."

[[connector.actions]]
type = "updateRecord"
label = "Update a record"
description = "Change the given fields of a record and leave the rest as they were."
outputs = [{ key = "id", description = "Record id, rec…" }, { key = "createdTime", description = "When the record was created, ISO 8601" }, { key = "fields", description = "The cell values keyed by field name; empty cells are omitted" }, { key = "url", description = "Where to open it, when the table was given by id" }]

[[connector.actions.inputs]]
key = "baseId"
label = "Base"
required = true
description = "The base id, app…, from the base URL or listBases."

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "Table id (tbl…) or table name."

[[connector.actions.inputs]]
key = "recordId"
label = "Record"
required = true
description = "The record id, rec…"

[[connector.actions.inputs]]
key = "fields"
label = "Fields"
type = "json"
required = true
description = "An object of cell values keyed by field name or id to change, e.g. {\"Name\":\"Union Square\",\"Visited\":true}."

[[connector.actions.inputs]]
key = "typecast"
label = "Typecast"
type = "boolean"
description = "Let Airtable convert strings to the field’s type, such as \"3\" into a number or a new option name into a select choice."

[[connector.actions.inputs]]
key = "returnFieldsByFieldId"
label = "Return fields by id"
type = "boolean"
description = "Key the returned fields by field id (fld…) instead of by name."

[[connector.actions]]
type = "upsertRecords"
label = "Upsert records"
description = "Create or update up to 10 records at once, matching each on the merge fields: no match creates, one match updates, several fail the call."
outputs = [{ key = "records", description = "Every record touched, as { id, createdTime, fields }" }, { key = "createdRecords", description = "The ids of records that were created" }, { key = "updatedRecords", description = "The ids of records that were updated" }]

[[connector.actions.inputs]]
key = "baseId"
label = "Base"
required = true
description = "The base id, app…, from the base URL or listBases."

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "Table id (tbl…) or table name."

[[connector.actions.inputs]]
key = "records"
label = "Records"
type = "json"
required = true
description = "An array of up to 10 {\"fields\": {…}} objects; a single object is taken as one record."

[[connector.actions.inputs]]
key = "fieldsToMergeOn"
label = "Fields to merge on"
required = true
description = "One to three field names or ids that identify a record, comma-separated or as a JSON array."

[[connector.actions.inputs]]
key = "typecast"
label = "Typecast"
type = "boolean"
description = "Let Airtable convert strings to the field’s type, such as \"3\" into a number or a new option name into a select choice."

[[connector.actions]]
type = "deleteRecord"
label = "Delete a record"
description = "Delete one record. A second call for the same id answers 404."
outputs = [{ key = "id", description = "The id that was deleted" }, { key = "deleted", type = "boolean", description = "True when Airtable confirmed the deletion" }]

[[connector.actions.inputs]]
key = "baseId"
label = "Base"
required = true
description = "The base id, app…, from the base URL or listBases."

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "Table id (tbl…) or table name."

[[connector.actions.inputs]]
key = "recordId"
label = "Record"
required = true
description = "The record id, rec…"

[[connector.actions]]
type = "getRecord"
label = "Get a record"
description = "Read one record by id. Empty cells are omitted from fields."
outputs = [{ key = "id", description = "Record id, rec…" }, { key = "createdTime", description = "When the record was created, ISO 8601" }, { key = "fields", description = "The cell values keyed by field name; empty cells are omitted" }, { key = "url", description = "Where to open it, when the table was given by id" }]

[[connector.actions.inputs]]
key = "baseId"
label = "Base"
required = true
description = "The base id, app…, from the base URL or listBases."

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "Table id (tbl…) or table name."

[[connector.actions.inputs]]
key = "recordId"
label = "Record"
required = true
description = "The record id, rec…"

[[connector.actions.inputs]]
key = "returnFieldsByFieldId"
label = "Return fields by id"
type = "boolean"
description = "Key the returned fields by field id (fld…) instead of by name."

[[connector.actions]]
type = "listRecords"
label = "List records"
description = "List the records of a table, optionally filtered by a formula or a view, up to maxRecords across pages."
outputs = [{ key = "records", description = "One entry per record: id, createdTime, fields, url" }, { key = "count", type = "number", description = "How many records came back" }]

[[connector.actions.inputs]]
key = "baseId"
label = "Base"
required = true
description = "The base id, app…, from the base URL or listBases."

[[connector.actions.inputs]]
key = "table"
label = "Table"
required = true
description = "Table id (tbl…) or table name."

[[connector.actions.inputs]]
key = "filterByFormula"
label = "Filter formula"
description = "An Airtable formula; only records where it is truthy are returned, e.g. {Status} = \"Open\"."

[[connector.actions.inputs]]
key = "view"
label = "View"
description = "A view name or id; records come back in the view’s order and hidden ones are skipped."

[[connector.actions.inputs]]
key = "maxRecords"
label = "Maximum records"
type = "number"
description = "Total records to return across pages. Defaults to 100."

[[connector.actions.inputs]]
key = "pageSize"
label = "Page size"
type = "number"
description = "Records per request, 1 to 100. Defaults to 100."

[[connector.actions.inputs]]
key = "fields"
label = "Fields"
description = "Field names or ids to include, comma-separated or as a JSON array. Blank returns every field."

[[connector.actions.inputs]]
key = "sort"
label = "Sort"
type = "json"
description = "An array of {\"field\": \"Name\", \"direction\": \"asc\"} objects; direction is asc or desc."

[[connector.actions.inputs]]
key = "returnFieldsByFieldId"
label = "Return fields by id"
type = "boolean"
description = "Key the returned fields by field id (fld…) instead of by name."

[[connector.actions]]
type = "listBases"
label = "List bases"
description = "The bases the token can reach, 1000 at a time, with the permission level it holds on each."
outputs = [{ key = "bases", description = "One entry per base: id, name, permissionLevel (none, read, comment, edit or create)" }, { key = "offset", description = "Pass back to fetch the next page, when present" }]

[[connector.actions.inputs]]
key = "offset"
label = "Offset"
description = "The offset from an earlier answer, to fetch the next thousand bases."

[[connector.actions]]
type = "getBaseSchema"
label = "Get a base schema"
description = "The tables of a base with their fields and views."
outputs = [{ key = "tables", description = "One entry per table: id, name, primaryFieldId, fields [{ id, name, type, options }], views [{ id, name, type }]" }]

[[connector.actions.inputs]]
key = "baseId"
label = "Base"
required = true
description = "The base id, app…, from the base URL or listBases."

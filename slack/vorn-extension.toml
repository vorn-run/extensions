id = "slack"
name = "Slack"
version = "0.1.2"
api = "vorn:extension@0.9"
publisher = "Vorn"
description = "Trigger workflows from Slack messages, thread replies and channel members, and post, reply or react from a step."

[icon]
view_box = "0 0 24 24"
paths = ["M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zm1.271 0a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zm0 1.271a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zm10.122 2.521a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zm-1.268 0a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zm-2.523 10.122a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zm0-1.268a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"]

[service]
command = ["node", "index.js"]

[checks]
command = ["node", "index.js", "--check"]

[declares]
network = ["slack.com", "files.slack.com"]

[connector]

[connector.auth]
rung = "key"
keys = ["botToken"]

[[connector.triggers]]
type = "messageInChannel"
label = "A message is posted in a channel"
description = "Fires for each new message in the configured channel. Bot and system messages are skipped unless includeBots is true."
default_workflow = { name = "Slack: channel messages", default_cron_from_minutes = 2 }

[[connector.triggers]]
type = "replyInThread"
label = "A reply is posted in a thread"
description = "Fires for each new reply under the configured parent message."
default_workflow = { name = "Slack: thread replies", default_cron_from_minutes = 2 }

[[connector.triggers]]
type = "memberJoinedChannel"
label = "A member joins a channel"
description = "Fires once for each user id in the channel that has not been seen before."
default_workflow = { name = "Slack: channel members", default_cron_from_minutes = 5 }

[[connector.actions]]
type = "postMessage"
label = "Post a message"
description = "Post a message to a channel, optionally under a thread or with Block Kit blocks."
outputs = [{ key = "ts", type = "string", description = "The new message ts" }, { key = "channel", type = "string", description = "The channel id it landed in" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "Channel id, or a name the bot can resolve"

[[connector.actions.inputs]]
key = "text"
label = "Text"
required = true
description = "Message text; with blocks it is the notification fallback"

[[connector.actions.inputs]]
key = "threadTs"
label = "Thread"
description = "Parent message ts to reply under"

[[connector.actions.inputs]]
key = "blocks"
label = "Blocks"
type = "json"
description = "Block Kit layout as a JSON array"

[[connector.actions]]
type = "replyInThread"
label = "Reply in a thread"
description = "Post a reply under a parent message."
outputs = [{ key = "ts", type = "string", description = "The reply ts" }, { key = "channel", type = "string", description = "The channel id" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "Channel id such as C0123456789"

[[connector.actions.inputs]]
key = "threadTs"
label = "Thread"
required = true
description = "The parent message ts"

[[connector.actions.inputs]]
key = "text"
label = "Text"
required = true
description = "Reply text"

[[connector.actions]]
type = "addReaction"
label = "Add a reaction"
description = "React to a message with an emoji."
outputs = [{ key = "ok", type = "boolean", description = "true once the reaction is on" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "Channel id such as C0123456789"

[[connector.actions.inputs]]
key = "ts"
label = "Message"
required = true
description = "The message ts"

[[connector.actions.inputs]]
key = "emoji"
label = "Emoji"
required = true
description = "Emoji name without colons, e.g. thumbsup"

[[connector.actions]]
type = "listChannels"
label = "List channels"
description = "List the public and private channels the bot can see, unarchived only."
outputs = [{ key = "channels", description = "Array of { id, name, isPrivate, isArchived, topic, purpose, numMembers }" }, { key = "nextCursor", type = "string", description = "Empty on the last page" }]

[[connector.actions.inputs]]
key = "limit"
label = "Limit"
type = "number"
description = "Channels per page, default 100, max 1000"

[[connector.actions.inputs]]
key = "cursor"
label = "Cursor"
description = "nextCursor from an earlier call, for the next page"

[[connector.actions]]
type = "getChannel"
label = "Get a channel"
description = "Read one channel by id."
outputs = [{ key = "id", type = "string", description = "Channel id" }, { key = "name", type = "string", description = "Channel name without the #" }, { key = "isPrivate", type = "boolean" }, { key = "isArchived", type = "boolean" }, { key = "topic", type = "string" }, { key = "purpose", type = "string" }, { key = "numMembers", type = "number" }, { key = "created", type = "number", description = "Unix seconds" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "Channel id such as C0123456789"

[[connector.actions]]
type = "findUserByEmail"
label = "Find a user by email"
description = "Look a user up by the address registered on the workspace."
outputs = [{ key = "id", type = "string", description = "User id" }, { key = "name", type = "string", description = "Handle" }, { key = "realName", type = "string" }, { key = "displayName", type = "string" }, { key = "email", type = "string", description = "Needs users:read.email" }, { key = "tz", type = "string", description = "IANA time zone" }, { key = "isBot", type = "boolean" }, { key = "deleted", type = "boolean" }]

[[connector.actions.inputs]]
key = "email"
label = "Email"
required = true
description = "The address registered on the workspace"

[[connector.actions]]
type = "getUser"
label = "Get a user"
description = "Read one user by id."
outputs = [{ key = "id", type = "string", description = "User id" }, { key = "name", type = "string", description = "Handle" }, { key = "realName", type = "string" }, { key = "displayName", type = "string" }, { key = "email", type = "string", description = "Needs users:read.email" }, { key = "tz", type = "string", description = "IANA time zone" }, { key = "isBot", type = "boolean" }, { key = "deleted", type = "boolean" }]

[[connector.actions.inputs]]
key = "user"
label = "User"
required = true
description = "User id such as U123ABC456"

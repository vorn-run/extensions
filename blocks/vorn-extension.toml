id = "vorn.blocks"
name = "Shell blocks"
version = "1.1.0"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "Draw each finished command as its own block with a copy button, and give the composer your history and completions."

[icon]
view_box = "0 0 24 24"
paths = ["M3 4h18v4H3z", "M3 10h18v4H3z", "M3 16h11v4H3z"]

[declares]
uses = ["files.read", "git.read", "storage"]

[service]
component = "blocks.wasm"
events = ["session.mark", "session.exited"]

[[contributes.shell]]
id = "commands"
title = "Commands"
tree = true

[[contributes.preferences]]
id = "minimalShellPrompt"
title = "Minimal prompt"
description = "Hides your shell's prompt; each block already shows folder and command"
type = "bool"
default = true

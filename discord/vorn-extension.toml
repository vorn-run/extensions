id = "discord"
name = "Discord"
version = "0.1.1"
api = "vorn:extension@1.0"
publisher = "Vorn"
description = "Trigger workflows from new Discord messages, members and threads, and send messages, reply in threads, react, pin or read channels and members from a step."

[icon]
view_box = "0 0 24 24"
paths = ["M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09-.01-.02-.04-.03-.07-.03-1.5.26-2.93.71-4.27 1.33-.01 0-.02.01-.03.02-2.72 4.07-3.47 8.03-3.1 11.95 0 .02.01.04.03.05 1.8 1.32 3.53 2.12 5.24 2.65.03.01.06 0 .07-.02.4-.55.76-1.13 1.07-1.74.02-.04 0-.08-.04-.09-.57-.22-1.11-.48-1.64-.78-.04-.02-.04-.08-.01-.11.11-.08.22-.17.33-.25.02-.02.05-.02.07-.01 3.44 1.57 7.15 1.57 10.55 0 .02-.01.05-.01.07.01.11.09.22.17.33.26.04.03.04.09-.01.11-.52.31-1.07.56-1.64.78-.04.01-.05.06-.04.09.32.61.68 1.19 1.07 1.74.03.01.06.02.09.01 1.72-.53 3.45-1.33 5.25-2.65.02-.01.03-.03.03-.05.44-4.53-.73-8.46-3.1-11.95-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12 0 1.17-.83 2.12-1.89 2.12z"]

[service]
command = ["node", "index.js"]

[checks]
command = ["node", "index.js", "--check"]

[declares]
network = ["discord.com"]

[connector]

[connector.auth]
rung = "key"
keys = ["botToken"]

[[connector.triggers]]
type = "messageInChannel"
label = "A message is posted in a channel"
description = "Fires once per new message in the channel or thread. Bot and system messages are skipped unless the connection includes them. Reading the text needs the Message Content intent."
default_workflow = { name = "Discord: messages", default_cron_from_minutes = 1 }

[[connector.triggers]]
type = "memberJoined"
label = "A member joins the server"
description = "Fires once per member who joined the guild since the last poll. Needs the Server Members intent."
default_workflow = { name = "Discord: new members", default_cron_from_minutes = 5 }

[[connector.triggers]]
type = "threadCreated"
label = "A thread is created"
description = "Fires once per active thread created since the last poll, in every channel of the guild or only under the configured channel."
default_workflow = { name = "Discord: new threads", default_cron_from_minutes = 5 }

[[connector.actions]]
type = "sendMessage"
label = "Send a message"
description = "Post a message to a channel or thread, optionally as a reply and with embeds."
outputs = [{ key = "id", description = "Id of the message" }, { key = "channelId", description = "The channel it landed in" }, { key = "content", description = "The text as stored" }, { key = "timestamp", description = "When Discord received it" }, { key = "url", description = "Link to the message" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "Channel or thread id."

[[connector.actions.inputs]]
key = "content"
label = "Message"
description = "Text, up to 2000 characters. Required unless embeds are given."

[[connector.actions.inputs]]
key = "embeds"
label = "Embeds"
type = "json"
description = "A JSON array of up to 10 embed objects (title, description, url, color, fields, footer, image, thumbnail, author, timestamp)."

[[connector.actions.inputs]]
key = "replyTo"
label = "Reply to"
description = "Message id to reply to, from {{trigger.item.id}}."

[[connector.actions]]
type = "createThread"
label = "Reply in a thread"
description = "Start a thread from a message, or use the one it already has, and post a reply in it."
outputs = [{ key = "threadId", description = "Id of the thread, the same as the source message" }, { key = "threadName", description = "Name of the thread" }, { key = "created", type = "boolean", description = "Whether this call made the thread" }, { key = "messageId", description = "Id of the reply posted in the thread" }, { key = "url", description = "Link to the reply" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "The parent channel id."

[[connector.actions.inputs]]
key = "message"
label = "Message"
required = true
description = "The message to thread from, from {{trigger.item.id}}."

[[connector.actions.inputs]]
key = "name"
label = "Thread name"
required = true
description = "Thread name, 1 to 100 characters. Ignored when the thread already exists."

[[connector.actions.inputs]]
key = "content"
label = "Reply"
required = true
description = "The reply to post in the thread, up to 2000 characters."

[[connector.actions.inputs]]
key = "autoArchiveDuration"
label = "Auto-archive after"
type = "select"
description = "Minutes of inactivity before the thread archives: 60, 1440, 4320 or 10080. Defaults to 1440."
options = [{ value = "60", label = "1 hour" }, { value = "1440", label = "1 day" }, { value = "4320", label = "3 days" }, { value = "10080", label = "1 week" }]

[[connector.actions]]
type = "addReaction"
label = "Add a reaction"
description = "React to a message with a Unicode or custom emoji."
outputs = [{ key = "ok", type = "boolean", description = "True once Discord answered 204" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "Channel or thread id."

[[connector.actions.inputs]]
key = "message"
label = "Message"
required = true
description = "Message id."

[[connector.actions.inputs]]
key = "emoji"
label = "Emoji"
required = true
description = "A Unicode emoji such as 👍, or name:id for a custom one."

[[connector.actions]]
type = "pinMessage"
label = "Pin a message"
description = "Pin a message in its channel. Pinning one already pinned is a no-op."
outputs = [{ key = "ok", type = "boolean", description = "True once Discord answered 204" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "Channel or thread id."

[[connector.actions.inputs]]
key = "message"
label = "Message"
required = true
description = "Message id."

[[connector.actions]]
type = "listChannels"
label = "List channels"
description = "The channels of a guild, sorted by position. Threads are not included."
outputs = [{ key = "channels", description = "One entry per channel: id, name, type, parentId, position, topic, nsfw" }]

[[connector.actions.inputs]]
key = "guild"
label = "Server"
required = true
description = "Guild (server) id."

[[connector.actions.inputs]]
key = "type"
label = "Channel type"
type = "number"
description = "Keep only this type: 0 text, 2 voice, 4 category, 5 announcement, 13 stage, 15 forum, 16 media."

[[connector.actions]]
type = "getChannel"
label = "Get a channel"
description = "Read one channel or thread by id."
outputs = [{ key = "id", description = "Channel id" }, { key = "name", description = "Channel name" }, { key = "type", type = "number", description = "Channel type number" }, { key = "guildId", description = "Guild the channel belongs to, or null for a DM" }, { key = "parentId", description = "Category or parent channel id, or null" }, { key = "topic", description = "Channel topic, or null" }, { key = "nsfw", type = "boolean", description = "Whether the channel is age-restricted" }, { key = "lastMessageId", description = "Id of the newest message, or null" }, { key = "rateLimitPerUser", type = "number", description = "Slowmode seconds, or null" }, { key = "threadMetadata", description = "Thread metadata for a thread, or null" }, { key = "messageCount", type = "number", description = "Messages in a thread, or null" }, { key = "memberCount", type = "number", description = "Members of a thread, or null" }]

[[connector.actions.inputs]]
key = "channel"
label = "Channel"
required = true
description = "Channel or thread id."

[[connector.actions]]
type = "getGuildMember"
label = "Get a server member"
description = "Read one member of a guild, with their nickname, roles and join date."
outputs = [{ key = "userId", description = "User id" }, { key = "username", description = "Account username" }, { key = "globalName", description = "Display name, or null" }, { key = "nick", description = "Nickname in this guild, or null" }, { key = "roles", description = "Role ids" }, { key = "joinedAt", description = "When they joined the guild" }, { key = "premiumSince", description = "When they started boosting, or null" }, { key = "pending", type = "boolean", description = "Whether membership screening is still pending" }, { key = "communicationDisabledUntil", description = "End of a timeout, or null" }, { key = "isBot", type = "boolean", description = "Whether the user is a bot" }]

[[connector.actions.inputs]]
key = "guild"
label = "Server"
required = true
description = "Guild (server) id."

[[connector.actions.inputs]]
key = "user"
label = "User"
required = true
description = "User id, from {{trigger.item.author.id}}."
